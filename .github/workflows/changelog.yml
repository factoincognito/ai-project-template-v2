name: Changelog Step

on:
  pull_request:
    types: [closed]

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A PR that already changed CHANGELOG.md (such as a project's setup
      # PR) gets no reminder. If the file list cannot be read, the step
      # fails and posts nothing.
      - name: Post changelog reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qxF CHANGELOG.md; then
            echo "PR #$PR_NUMBER already changes CHANGELOG.md, so no reminder is posted."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" \
            --body "<!-- clead-changelog-step --> PR merged. Crog: open a PR updating CHANGELOG.md." \
            --repo "$REPO"
