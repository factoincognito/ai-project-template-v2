# Saves the built bash 3.2 for the Bootstrapper workflow's bash 3.2 leg
# (spec: docs/BACKLOG.md, PBI-1.26). Template-only: this workflow is not
# in bootstrap/manifest.txt and never ships to bootstrapped projects.
#
# A cache saved by a pull request run can be restored only by later runs
# of that pull request; runs of any pull request can restore a cache
# saved on main. The Bootstrapper workflow never runs on main, so this
# workflow runs there instead: on a push to main (and by hand) it restores
# the key below and, on a miss, builds bash with bootstrap/bash32.sh and
# saves it. The key and the path are the same as in bootstrapper.yml (the
# cache's version is made from the path, so another path would make every
# restore a miss).
#
# The key holds the runner image name and the gcc version, so a new image
# or compiler builds bash again. Any other change within the same image
# name and gcc version (glibc, other tools) reuses the old build until the
# cache is evicted; the bash still runs the whole suite.
name: Bash 3.2 cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash32-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Identify the runner image
        id: image
        run: |
          # ImageOS is set by the runner, not by this workflow, and the env
          # context holds only what the workflow sets, so it is read here
          # in the shell.
          image="${ImageOS:-}"
          gcc_version="$(gcc -dumpfullversion 2>/dev/null || true)"
          if [ -z "$image" ] || [ -z "$gcc_version" ]; then
            echo "::error::Could not read the runner image name (ImageOS: '$image') or the gcc version ('$gcc_version'); the bash 3.2 cache key needs both."
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "gcc=$gcc_version" >>"$GITHUB_OUTPUT"
      - name: Restore bash 3.2 from the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bash32
          key: bash-3.2.57-3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4-${{ runner.os }}-${{ steps.image.outputs.image }}-gcc${{ steps.image.outputs.gcc }}
      - name: Get bash 3.2
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash bootstrap/bash32.sh "$RUNNER_TEMP/bash32"
      - name: Save bash 3.2 to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/bash32
          key: bash-3.2.57-3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4-${{ runner.os }}-${{ steps.image.outputs.image }}-gcc${{ steps.image.outputs.gcc }}
