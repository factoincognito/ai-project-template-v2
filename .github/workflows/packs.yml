# Tests the language packs on real GitHub runners (PBI-1.6) and the whole
# chain template -> bootstrapper -> project (PBI-1.15).
# Template-only: this workflow is not in bootstrap/manifest.txt and never
# ships to bootstrapped projects.
#
# Each pack job builds the bootstrapper from this checkout
# (bootstrap/build.sh), creates a project from that output (the
# bootstrapper's files, plus the pack laid out from the bootstrapper's
# own languages/ folder with tools/layout-pack.sh, plus deleting
# languages/), then runs that pack's own CI steps. This follows the
# bootstrapper README's manual steps with two differences: the pack's
# .gitignore replaces the bootstrapper's instead of being merged into
# it (nothing here reads it), and languages/ is deleted, where the README
# only says you can. The
# steps below copy the pack's ci.yml commands verbatim;
# tools/test-layout-pack.sh fails if they drift apart. The template has
# no lockfile, so the npm-based packs (node, web, react-native) run
# `npm install` to create one first ("First-time setup" in the pack's
# code-standards.md), then `npm ci` runs as a project's CI would. The
# Python pack has no lockfile to create; pack-python leaves out the pip
# cache of the pack's ci.yml, which would look for requirements files in
# the template checkout.
#
# languages/ is deleted because it must be: left in a project, Biome
# fails on the nested pack configs and Jest runs the other packs' tests.
#
# This workflow also runs as part of a release: bootstrapper.yml calls it
# on a pushed v* tag and the publish job needs it to pass.
name: Packs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pack-layout-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test layout-pack.sh
        run: bash tools/test-layout-pack.sh

  pack-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the bootstrapper
        working-directory: .
        run: bash template/bootstrap/build.sh bootstrapper v0.0.0 "$(git -C template rev-parse HEAD)"

      - name: Create the project from it with the node pack
        working-directory: .
        run: |
          set -euo pipefail
          PACKS_DIR=bootstrapper/languages bash template/tools/layout-pack.sh node pack
          cp -a bootstrapper project
          git -C project init -q -b main
          git -C project add -A
          git -C project -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Bootstrapper output"
          git -C project checkout -q -b setup
          cp -a pack/. project/
          rm -rf project/languages
          git -C project add -A
          git -C project -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Set up the node pack"

      - name: Check the setup change with the pack's own check
        env:
          TEST_FIRST_BASE: main
        run: bash .github/scripts/require-test-change.sh --code 'src/*' --test 'src/*.test.ts' 'src/*.spec.ts' 'src/*__tests__/*'

      - name: Create the lockfile
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npx biome ci --error-on-warnings .

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'

      # Last, so the branch it leaves behind cannot affect the steps above.
      # Any file under src/ is a source change; the pack's patterns decide.
      - name: Refuse a source change without a test
        run: |
          set -euo pipefail
          git checkout -q main
          git merge -q --ff-only setup
          git checkout -q -b change
          mkdir -p src
          echo untested > src/untested.txt
          git add src/untested.txt
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Source change without a test"
          cmd="$(sed -n 's/^ *run: //p' .github/workflows/ci.yml | grep -F require-test-change.sh)"
          [ -n "$cmd" ]
          # The refusal is the point of this step: stop workflow commands so
          # its ::error:: does not show as an annotation on a green job, and
          # keep it out of the job summary.
          token="stop-$RANDOM$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          set +e
          env -u GITHUB_STEP_SUMMARY TEST_FIRST_BASE=main bash -c "$cmd"
          rc=$?
          set -e
          echo "::$token::"
          [ "$rc" -eq 1 ]


  pack-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
