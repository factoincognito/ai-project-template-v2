          git add src/untested.txt
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Source change without a test"
          cmd="$(sed -n 's/^ *run: //p' .github/workflows/ci.yml | grep -F require-test-change.sh)"
          [ -n "$cmd" ]
          # The refusal is the point of this step: stop workflow commands so
          # its ::error:: does not show as an annotation on a green job, and
          # keep it out of the job summary.
          token="stop-$RANDOM$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          set +e
          env -u GITHUB_STEP_SUMMARY TEST_FIRST_BASE=main bash -c "$cmd"
          rc=$?
          set -e
          echo "::$token::"
          [ "$rc" -eq 1 ]


  pack-react-native:
