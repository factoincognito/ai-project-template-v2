# Tests the language packs on real GitHub runners (PBI-1.6).
# Template-only: this workflow is not in bootstrap/manifest.txt and never
# ships to bootstrapped projects.
#
# Each pack job lays the pack out in a fresh project next to the
# template checkout, exactly as the README table says
# (tools/layout-pack.sh), then runs that pack's own CI steps. The steps
# below copy the pack's ci.yml commands verbatim;
# tools/test-layout-pack.sh fails if they drift apart. The template has
# no lockfile, so the Node packs run `npm install` to create one first
# ("First-time setup" in the pack's code-standards.md), then `npm ci`
# runs as a project's CI would. The Python pack has no lockfile to
# create; pack-python leaves out the pip cache of the pack's ci.yml,
# which would look for requirements files in the template checkout.
name: Packs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-layout-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test layout-pack.sh
        run: bash tools/test-layout-pack.sh

  pack-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lay out the node pack
        working-directory: .
        run: bash template/tools/layout-pack.sh node project

      - name: Create the lockfile
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npx biome ci --error-on-warnings .

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'

  pack-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lay out the web pack
        working-directory: .
        run: bash template/tools/layout-pack.sh web project

      - name: Create the lockfile
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npx biome ci --error-on-warnings .

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        run: npm run test:e2e

      - name: Keep the end-to-end report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: project/playwright-report/
          retention-days: 7

  pack-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Lay out the python pack
        working-directory: .
        run: bash template/tools/layout-pack.sh python project

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov=src --cov-fail-under=80
