          rm -rf project/languages
          git -C project add -A
          git -C project -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Set up the web pack"

      - name: Check the setup change with the pack's own check
        env:
          TEST_FIRST_BASE: main
        run: bash .github/scripts/require-test-change.sh --code 'src/*' 'index.html' --test 'src/*.test.ts' 'src/*.spec.ts' 'src/*__tests__/*' 'e2e/*'

      - name: Create the lockfile
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npx biome ci --error-on-warnings .

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        run: npm run test:e2e

      - name: Keep the end-to-end report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: project/playwright-report/
          retention-days: 7

      # Last, so the branch it leaves behind cannot affect the steps above.
      # Any file under src/ is a source change; the pack's patterns decide.
      - name: Refuse a source change without a test
        run: |
          set -euo pipefail
          git checkout -q main
          git merge -q --ff-only setup
          git checkout -q -b change
          mkdir -p src
          echo untested > src/untested.txt
          git add src/untested.txt
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Source change without a test"
          cmd="$(sed -n 's/^ *run: //p' .github/workflows/ci.yml | grep -F require-test-change.sh)"
          [ -n "$cmd" ]
          # The refusal is the point of this step: stop workflow commands so
          # its ::error:: does not show as an annotation on a green job, and
          # keep it out of the job summary.
          token="stop-$RANDOM$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          set +e
          env -u GITHUB_STEP_SUMMARY TEST_FIRST_BASE=main bash -c "$cmd"
          rc=$?
          set -e
          echo "::$token::"
          [ "$rc" -eq 1 ]


  pack-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: template

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the bootstrapper
        working-directory: .
        run: bash template/bootstrap/build.sh bootstrapper v0.0.0 "$(git -C template rev-parse HEAD)"

      - name: Create the project from it with the python pack
        working-directory: .
        run: |
          set -euo pipefail
          PACKS_DIR=bootstrapper/languages bash template/tools/layout-pack.sh python pack
          cp -a bootstrapper project
          git -C project init -q -b main
          git -C project add -A
          git -C project -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Bootstrapper output"
          git -C project checkout -q -b setup
          cp -a pack/. project/
          rm -rf project/languages
          git -C project add -A
          git -C project -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Set up the python pack"

      - name: Check the setup change with the pack's own check
        env:
          TEST_FIRST_BASE: main
        run: bash .github/scripts/require-test-change.sh --code 'src/*' --test 'src/tests/*'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov=src --cov-fail-under=80

      # Last, so the branch it leaves behind cannot affect the steps above.
      # Any file under src/ is a source change; the pack's patterns decide.
      - name: Refuse a source change without a test
        run: |
          set -euo pipefail
