# Builds and publishes the bootstrapper (spec: docs/BACKLOG.md, PBI-1.10).
# Template-only: this workflow is not in bootstrap/manifest.txt and never
# ships to bootstrapped projects.
#
# Runs on pull requests to main and on pushed v* tags only, not on branch
# pushes, so each push to a PR runs the OS matrix once. Main changes
# only through pull requests, which are tested on the merge ref; a
# branch pushed without a PR is not tested here. A newer push to the
# same PR cancels the older run; a tag run is never cancelled in
# progress. After a merge, this workflow does not run on main: protection
# has strict: false, so a PR's merge-ref run can predate another PR's
# merge, and this workflow's suites (bootstrap/test.sh,
# bootstrap/test-bootstrap-project.sh on the OS matrix,
# tools/test-require-test-change.sh) do not run on the combined tree
# until a v* tag, whose run still gates publish. ci.yml and packs.yml do
# run on main after every merge (they trigger on pushes to any branch).
#
# - Every pull request to main: run the build.sh / publish.sh tests and
#   the tests of the shared test-first check
#   (tools/test-require-test-change.sh) on ubuntu, and the tests of the
#   bootstrap script (bootstrap/test-bootstrap-project.sh) on ubuntu,
#   macOS (Apple's /bin/bash 3.2) and Windows (Git for Windows bash).
#   bootstrapper-test, a required check, passes only if all of them did.
#   Each OS leg runs as 4 shards (PBI-1.18; one leg took up to 76 min
#   on Windows): shard i runs every 4th test from index i-1 and records
#   the tests it ran; bootstrapper-test also fails unless, for every OS,
#   the 4 shards together ran every test exactly once
#   (bootstrap/check-shards.sh).
# - A pushed v* tag: run the tests and the pack chain test (packs.yml:
#   build the bootstrapper, create a project from it, run each pack's
#   CI), refuse unless the tagged commit is on main, build, and publish
#   the output to the default branch of factoincognito/ai-project-bootstrap as
#   one commit, then push the same tag there. Needs the Actions secret
#   BOOTSTRAP_PUSH_TOKEN (fine-grained, that repo only, Contents and
#   Workflows: read and write).
name: Bootstrapper

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

# One group per pull request (per ref for a tag). Only pull_request runs
# are cancelled in progress, never a tag run with its publish.
concurrency:
  group: bootstrapper-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test build.sh and publish.sh
        run: bash bootstrap/test.sh
      - name: Test the require-test-change check
        run: bash tools/test-require-test-change.sh
      - name: Test e2e-check.sh
        run: bash bootstrap/test-e2e-check.sh

  bootstrap-project-test:
    strategy:
      # Every OS and shard reports, even when one fails first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Shards 1..n of every OS leg. n is also in BOOTSTRAP_TEST_SHARD
        # and BOOTSTRAP_TEST_MANIFEST below; bootstrapper-test fails if
        # a shard of 1..n did not report.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    env:
      BOOTSTRAP_TEST_SHARD: ${{ matrix.shard }}/4
      BOOTSTRAP_TEST_MANIFEST: shard-list/${{ matrix.os }}-${{ matrix.shard }}-of-4.txt
    defaults:
      run:
        # On Windows this is Git for Windows' bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Test bootstrap-project.sh
        if: runner.os != 'macOS'
        run: bash bootstrap/test-bootstrap-project.sh
      - name: Test bootstrap-project.sh with macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          # The tests start the script and build.sh with plain bash, so
          # put Apple's /bin/bash first on PATH: the runner image may
          # have a newer bash there.
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          export PATH="$RUNNER_TEMP/bash32:$PATH"
          v="$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          echo "bash on PATH: $(command -v bash), version $v"
          if [ "$v" != "3.2" ]; then
            echo "::error::Expected bash 3.2 on PATH, got $v."
            exit 1
          fi
          /bin/bash bootstrap/test-bootstrap-project.sh
      - name: Upload the list of tests this shard ran
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: shard-list/
          if-no-files-found: error
          retention-days: 1

  # The required check. A matrix would rename it, so it is one job that
  # needs the test jobs, always runs (a job skipped because a need failed
  # reports as success) and passes only if every need succeeded and
  # every shard of every OS leg reported running its tests, which
  # together are every test exactly once.
  bootstrapper-test:
    if: always()
    needs: [scripts-test, bootstrap-project-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the lists of tests the shards ran
        uses: actions/download-artifact@v7
        with:
          pattern: bootstrap-tests-*
          path: shard-list
          merge-multiple: true
      - name: Require every test job to have succeeded and every shard to have reported
        # Also when the download failed: the check then names what is missing.
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          BOOTSTRAP_TEST_LIST=1 bash bootstrap/test-bootstrap-project.sh >all-tests.txt
          bash bootstrap/check-shards.sh shard-list all-tests.txt ubuntu-latest macos-latest windows-latest

  packs:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/packs.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [bootstrapper-test, packs]
    runs-on: ubuntu-latest
    concurrency:
      group: bootstrapper-publish
      cancel-in-progress: false
    env:
      BOOTSTRAP_REPO: factoincognito/ai-project-bootstrap
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history of all branches, so origin/main is available
          # for the on-main check.
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          bash bootstrap/require-on-main.sh . "$(git rev-parse HEAD)" origin/main

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          bash bootstrap/build.sh "$RUNNER_TEMP/bootstrapper" "$VERSION" "$COMMIT"

      - name: Publish to ${{ env.BOOTSTRAP_REPO }}
        env:
          VERSION: ${{ github.ref_name }}
          TOKEN: ${{ secrets.BOOTSTRAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret BOOTSTRAP_PUSH_TOKEN is not set; nothing was published."
            exit 1
          fi
          # The token goes in an auth header, not the URL, so git never
          # prints it. Actions also masks secrets in the log.
          BASIC="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$BASIC"
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $BASIC"
          bash bootstrap/publish.sh "$RUNNER_TEMP/bootstrapper" "$VERSION" "$COMMIT" \
            "https://github.com/$BOOTSTRAP_REPO.git"
