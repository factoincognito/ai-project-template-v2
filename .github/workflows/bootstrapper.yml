# Builds and publishes the bootstrapper (spec: docs/BACKLOG.md, PBI-1.10).
# Template-only: this workflow is not in bootstrap/manifest.txt and never
# ships to bootstrapped projects.
#
# Runs on pull requests to main and on pushed v* tags only, not on branch
# pushes, so each push to a PR runs the test matrix once. Main changes
# only through pull requests, which are tested on the merge ref; a
# branch pushed without a PR is not tested here. A newer push to the
# same PR cancels the older run; a tag run is never cancelled in
# progress. After a merge, this workflow does not run on main: protection
# has strict: false, so a PR's merge-ref run can predate another PR's
# merge, and this workflow's suites (bootstrap/test.sh,
# bootstrap/test-bootstrap-project.sh on the matrix legs,
# tools/test-require-test-change.sh) do not run on the combined tree
# until a v* tag, whose run still gates publish. ci.yml and packs.yml do
# run on main after every merge (they trigger on pull requests and on pushes
# to main).
#
# - Every pull request to main: run the build.sh / publish.sh tests and
#   the tests of the shared test-first check
#   (tools/test-require-test-change.sh) and of the STATUS.md format check
#   (tools/test-check-status.sh) on ubuntu, and the tests of the
#   bootstrap script (bootstrap/test-bootstrap-project.sh) on ubuntu,
#   ubuntu with GNU bash 3.2.57 built from source (PBI-1.26; the cache of
#   that build is saved by bash32-cache.yml) and Windows (Git for Windows
#   bash). There is no macOS leg: macOS is not supported for now
#   (PBI-1.26; PBI-1.27 brings it back), and the bash 3.2 leg keeps the
#   script checked against the bash 3.2 that Macs ship.
#   bootstrapper-test, a required check, passes only if all of them did.
#   Each leg runs as shards (PBI-1.18; one leg took up to 76 min
#   on Windows), as many as that OS's total test time needs (PBI-1.25:
#   4 on ubuntu, 8 on the bash 3.2 leg, whose tests took 1061 to 1271 s a
#   shard with 4 (about 2.4 times ubuntu's), 8 on Windows, whose tests
#   take about 2.5 times as long as ubuntu's), split by the measured time
#   of each test on that OS (bootstrap/test-durations.txt, PBI-1.22; its
#   macos-latest column is kept for PBI-1.27); each shard records the
#   tests it ran; bootstrapper-test also fails unless, for every leg,
#   its shards together ran every test exactly once
#   (bootstrap/check-shards.sh).
# - A pull request that changes only files no test reads
#   (bootstrap/not-read-by-tests.txt, judged by the base branch's copy
#   of bootstrap/changed-inputs.sh and of that list, so an accidental
#   edit of either cannot skip its own tests; an edit of this workflow
#   can, and is reviewed as any workflow change) skips the test jobs
#   (PBI-1.22, part 1). bootstrapper-test still reports: it passes only
#   when the changes job succeeded and said the tests are not needed and
#   both test jobs were skipped. Each test job deletes the listed files
#   before the tests run, so a test that starts reading one fails.
# - A pushed v* tag: run the tests and the pack chain test (packs.yml:
#   build the bootstrapper, create a project from it, run each pack's
#   CI), refuse unless the tagged commit is on main, build, and publish
#   the output to the default branch of factoincognito/ai-project-bootstrap as
#   one commit, then push the same tag there. Needs the Actions secret
#   BOOTSTRAP_PUSH_TOKEN (fine-grained, that repo only, Contents and
#   Workflows: read and write).
name: Bootstrapper

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

# One group per pull request (per ref for a tag). Only pull_request runs
# are cancelled in progress, never a tag run with its publish.
concurrency:
  group: bootstrapper-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the tests are needed: always for a tag; for a pull request,
  # when it changes a file the tests read. Judged by the base branch's
  # script and list, so a pull request cannot switch off its own tests;
  # when the base has no such script, the tests run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.judge.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its parents: HEAD^1 is the base branch.
          fetch-depth: 2
      - name: Decide whether the tests are needed
        id: judge
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          needed=true
          if [ "$EVENT" = pull_request ] \
            && git show HEAD^1:bootstrap/changed-inputs.sh >"$RUNNER_TEMP/changed-inputs.sh" 2>/dev/null \
            && git show HEAD^1:bootstrap/not-read-by-tests.txt >"$RUNNER_TEMP/not-read-by-tests.txt" 2>/dev/null; then
            needed="$(LIST="$RUNNER_TEMP/not-read-by-tests.txt" bash "$RUNNER_TEMP/changed-inputs.sh" needed HEAD^1 HEAD)" \
              || needed=error
          fi
          # Anything but a clear false runs the tests: a broken judge never
          # skips them, and never blocks a pull request either.
          case "$needed" in
            true | false) ;;
            *) echo "::warning::could not judge whether the tests are needed ($needed); they run"; needed=true ;;
          esac
          echo "Tests needed: $needed"
          echo "needed=$needed" >>"$GITHUB_OUTPUT"

  scripts-test:
    needs: [changes]
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete the files no test reads
        run: bash bootstrap/changed-inputs.sh remove
      - name: Test build.sh and publish.sh
        run: bash bootstrap/test.sh
      - name: Test the require-test-change check
        run: bash tools/test-require-test-change.sh
      - name: Test the STATUS.md format check
        run: bash tools/test-check-status.sh
      - name: Test e2e-check.sh
        run: bash bootstrap/test-e2e-check.sh

  bootstrap-project-test:
    needs: [changes]
    if: needs.changes.outputs.needed == 'true'
    strategy:
      # Every leg and shard reports, even when one fails first.
      fail-fast: false
      matrix:
        # Each leg has the shard count its total test time needs
        # (PBI-1.25; times in bootstrap/test-durations.txt): shards 1..of
        # of every leg. bootstrapper-test fails if a shard of 1..of of a
        # leg did not report. A leg is an OS, except ubuntu-bash32 (PBI-1.26):
        # Linux with GNU bash 3.2.57 built from source, split by ubuntu's
        # times (os is the runner and the column of the durations file).
        include:
          - { leg: ubuntu-latest, os: ubuntu-latest, shard: 1, of: 4 }
          - { leg: ubuntu-latest, os: ubuntu-latest, shard: 2, of: 4 }
          - { leg: ubuntu-latest, os: ubuntu-latest, shard: 3, of: 4 }
          - { leg: ubuntu-latest, os: ubuntu-latest, shard: 4, of: 4 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 1, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 2, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 3, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 4, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 5, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 6, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 7, of: 8 }
          - { leg: ubuntu-bash32, os: ubuntu-latest, shard: 8, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 1, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 2, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 3, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 4, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 5, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 6, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 7, of: 8 }
          - { leg: windows-latest, os: windows-latest, shard: 8, of: 8 }
    runs-on: ${{ matrix.os }}
    env:
      BOOTSTRAP_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
      BOOTSTRAP_TEST_MANIFEST: shard-list/${{ matrix.leg }}-${{ matrix.shard }}-of-${{ matrix.of }}.txt
      # Split by the measured time of each test on this OS (PBI-1.22).
      BOOTSTRAP_TEST_WEIGHTS: bootstrap/test-durations.txt:${{ matrix.os }}
    defaults:
      run:
        # On Windows this is Git for Windows' bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Delete the files no test reads
        run: bash bootstrap/changed-inputs.sh remove
      - name: Identify the runner image
        id: image
        if: matrix.leg == 'ubuntu-bash32'
        run: |
          # The key of the bash 3.2 cache holds the image name and the gcc
          # version: a new image or compiler builds bash again, so a build
          # a newer gcc breaks shows at "Get bash 3.2" instead of being
          # hidden by an old cache. ImageOS is set by the runner, not by
          # this workflow, and the env context holds only what the workflow
          # sets, so it is read here in the shell.
          image="${ImageOS:-}"
          gcc_version="$(gcc -dumpfullversion 2>/dev/null || true)"
          if [ -z "$image" ] || [ -z "$gcc_version" ]; then
            echo "::error::Could not read the runner image name (ImageOS: '$image') or the gcc version ('$gcc_version'); the bash 3.2 cache key needs both."
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "gcc=$gcc_version" >>"$GITHUB_OUTPUT"
      - name: Restore bash 3.2 from the cache
        id: cache
        if: matrix.leg == 'ubuntu-bash32'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bash32
          key: bash-3.2.57-3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4-${{ runner.os }}-${{ steps.image.outputs.image }}-gcc${{ steps.image.outputs.gcc }}
      - name: Get bash 3.2
        if: matrix.leg == 'ubuntu-bash32' && steps.cache.outputs.cache-hit != 'true'
        run: bash bootstrap/bash32.sh "$RUNNER_TEMP/bash32"
      - name: Test bootstrap-project.sh
        if: matrix.leg != 'ubuntu-bash32'
        run: bash bootstrap/test-bootstrap-project.sh
      - name: Test bootstrap-project.sh with bash 3.2 built on Linux
        if: matrix.leg == 'ubuntu-bash32'
        run: |
          # The tests start the script and build.sh with plain bash, so put
          # the bash 3.2 first on PATH. A plain bash started inside a test
          # run is the runner's own (bootstrap-project.sh itself runs on
          # 3.2).
          export PATH="$RUNNER_TEMP/bash32:$PATH"
          v="$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          echo "bash on PATH: $(command -v bash), version $v"
          if [ "$v" != "3.2" ]; then
            echo "::error::Expected bash 3.2 on PATH, got $v."
            exit 1
          fi
          bash bootstrap/test-bootstrap-project.sh
      - name: Upload the list of tests this shard ran
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-tests-${{ matrix.leg }}-${{ matrix.shard }}
          path: shard-list/
          if-no-files-found: error
          retention-days: 1

  # The required check. A matrix would rename it, so it is one job that
  # needs the test jobs, always runs (a job skipped because a need failed
  # reports as success) and passes only if every need succeeded and
  # every shard of every leg reported running its tests, which
  # together are every test exactly once.
  bootstrapper-test:
    if: always()
    needs: [changes, scripts-test, bootstrap-project-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the lists of tests the shards ran
        if: needs.changes.outputs.needed == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: bootstrap-tests-*
          path: shard-list
          merge-multiple: true
      - name: Require every test job to have succeeded and every shard to have reported
        # Also when the download failed: the check then names what is missing.
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_NEEDED: ${{ needs.changes.outputs.needed }}
          TEST_RESULTS: ${{ needs.scripts-test.result }} ${{ needs.bootstrap-project-test.result }}
        run: |
          # Not needed: passes only if the changes job said so and both
          # test jobs were skipped. Anything else is judged in full.
          if [ "$CHANGES_RESULT" = success ] && [ "$TESTS_NEEDED" = false ] && [ "$TEST_RESULTS" = "skipped skipped" ]; then
            echo "This pull request changes only files no test reads (bootstrap/not-read-by-tests.txt): the test jobs were skipped."
            exit 0
          fi
          BOOTSTRAP_TEST_LIST=1 bash bootstrap/test-bootstrap-project.sh >all-tests.txt
          bash bootstrap/check-shards.sh shard-list all-tests.txt ubuntu-latest ubuntu-bash32 windows-latest

  packs:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/packs.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [bootstrapper-test, packs]
    runs-on: ubuntu-latest
    concurrency:
      group: bootstrapper-publish
      cancel-in-progress: false
    env:
      BOOTSTRAP_REPO: factoincognito/ai-project-bootstrap
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history of all branches, so origin/main is available
          # for the on-main check.
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          bash bootstrap/require-on-main.sh . "$(git rev-parse HEAD)" origin/main

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          bash bootstrap/build.sh "$RUNNER_TEMP/bootstrapper" "$VERSION" "$COMMIT"

      - name: Publish to ${{ env.BOOTSTRAP_REPO }}
        env:
          VERSION: ${{ github.ref_name }}
          TOKEN: ${{ secrets.BOOTSTRAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret BOOTSTRAP_PUSH_TOKEN is not set; nothing was published."
            exit 1
          fi
          # The token goes in an auth header, not the URL, so git never
          # prints it. Actions also masks secrets in the log.
          BASIC="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$BASIC"
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $BASIC"
          bash bootstrap/publish.sh "$RUNNER_TEMP/bootstrapper" "$VERSION" "$COMMIT" \
            "https://github.com/$BOOTSTRAP_REPO.git"
