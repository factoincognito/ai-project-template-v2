# The template's own CI. Template-only: this file is not in
# bootstrap/manifest.txt and never ships. What ships as a new project's
# ci.yml is the checkout-only stub in bootstrap/stubs/.github/workflows/,
# replaced by a language pack's ci.yml.
#
# The job is named `build` because branch protection requires that name.
# Its first step is the test-first check: a pull request that changes code
# (scripts, workflows, pack files, the shipped dotfiles, and the lint and
# coverage configurations .shellcheckrc and .simplecov) without changing
# a test fails. Patterns: see the --code, --test and --ignore flags below.
# Its second step checks that STATUS.md and the shipped stub keep the
# headings the product owner's overview reads (tools/check-status.sh); it
# runs here, not in the Bootstrapper workflow's test jobs, because those
# skip a change that touches only STATUS.md (bootstrap/not-read-by-tests.txt).
# Both checks' own tests run in a job that the required bootstrapper-test
# check needs (.github/workflows/bootstrapper.yml). Its third step checks
# that this file and packs.yml run on pull requests and on pushes to main
# only (tools/test-ci-triggers.sh, PBI-1.25 part 2): a push trigger on every
# branch runs them twice for each push to a pull request branch.
# Its fourth step checks the Rules edition the template ships in
# bootstrap/stubs/rules (.github/scripts/check-rules-edition.sh, template
# mode): every file is the one its EDITION lists, and a pull request that
# changes the folder changes nothing else. While no edition is taken the
# folder is absent and there is nothing to check. The folder is ignored by
# the test-first check: it is a build output, tested where it is built.
# Its fifth step lints the template's own scripts (every script in
# bootstrap/, tools/ and .github/scripts/, the tests included) with
# shellcheck 0.11.0 and fails on any finding (PBI-1.41 part (a)); what is
# turned off, and why, is in .shellcheckrc. shellcheck is the official
# release archive, its SHA-256 checked before it is unpacked; it is a CI
# and local tool only, never copied into the repository or shipped.
# Its sixth step checks the format of the same scripts with shfmt 3.14.1
# (`shfmt -i 2 -ci -d`) and fails on any difference, and on an empty
# selection (PBI-1.41 part (b)). shfmt is the official Linux amd64 release
# binary, its SHA-256 checked before it is run; like shellcheck, it is
# never copied into the repository or shipped.
# The lint and format steps set no shell: of their own, and each script
# starts with `set -euo pipefail`, so a wrong hash or version stops it
# whatever shell runs it (PBI-1.41 follow-up (4)).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the base branch is there to compare with.
          fetch-depth: 0
      - name: Require a test change with a code change
        run: bash .github/scripts/require-test-change.sh --code '*.sh' 'bootstrap/*' 'tools/*' '.github/workflows/*' '.github/scripts/*' 'languages/*' '.gitattributes' '.gitignore' '.shellcheckrc' '.simplecov' --test 'bootstrap/test.sh' 'bootstrap/test-*.sh' 'tools/test-*.sh' 'languages/*.test.ts' 'languages/*.test.tsx' 'languages/*.spec.ts' 'languages/*.spec.tsx' 'languages/*__tests__/*' 'languages/*/src/tests/*' 'languages/*/starter/tests/*' 'languages/*/test_*.py' 'languages/*.e2e.ts' --ignore '*.md' 'bootstrap/stubs/licenses/*' 'bootstrap/stubs/rules/*'
      - name: Check the STATUS.md format
        run: bash tools/check-status.sh
      - name: Check the triggers of ci.yml and packs.yml
        run: bash tools/test-ci-triggers.sh
      - name: Check the Rules edition
        run: bash .github/scripts/check-rules-edition.sh --template bootstrap/stubs/rules
      - name: Lint the scripts with shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --max-time 120 -o "$dir/shellcheck.tar.xz" "$url"
          echo "$SHELLCHECK_SHA256  $dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          "$dir/shellcheck" --version | grep -qxF "version: $SHELLCHECK_VERSION"
          git ls-files -z 'bootstrap/*.sh' 'tools/*.sh' '.github/scripts/*' | xargs -0 "$dir/shellcheck"
      - name: Check the script format with shfmt
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          url="https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          dir="$RUNNER_TEMP/shfmt"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --max-time 120 -o "$dir/shfmt" "$url"
          echo "$SHFMT_SHA256  $dir/shfmt" | sha256sum -c -
          chmod +x "$dir/shfmt"
          "$dir/shfmt" --version | grep -qxF "v$SHFMT_VERSION"
          git ls-files -z 'bootstrap/*.sh' 'tools/*.sh' '.github/scripts/*' >"$dir/files"
          if [ ! -s "$dir/files" ]; then
            echo "::error::no scripts selected to check"
            exit 1
          fi
          xargs -0 "$dir/shfmt" -i 2 -ci -d <"$dir/files"
